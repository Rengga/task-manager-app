<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Tugas - TaskFlow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background-color: #f3f4f6;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .navbar-custom {
        background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      }
      .card-custom {
        border: none;
        border-radius: 16px;
        background: #ffffff;
      }
      .form-control-custom {
        border-radius: 10px;
        border: 1px solid #e5e7eb;
        background-color: #f9fafb;
        padding: 10px 14px;
      }
      .form-control-custom:focus {
        background-color: #ffffff;
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      }
      .btn-custom {
        background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        border: none;
        border-radius: 10px;
        transition: all 0.2s ease;
      }
      .btn-custom:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-5"
    >
      <div class="container py-1">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="index.html"
        >
          <i class="bi bi-grid-1x2-fill fs-4"></i>
          <span>TaskFlow</span>
        </a>
        <a
          href="index.html"
          class="btn btn-light btn-sm fw-bold px-3 py-2 rounded-3 text-primary shadow-sm d-flex align-items-center gap-2"
        >
          <i class="bi bi-arrow-left"></i> Kembali
        </a>
      </div>
    </nav>

    <div class="container mb-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card card-custom shadow-sm p-4">
            <div class="card-body">
              <div class="d-flex align-items-center gap-2 mb-4">
                <div
                  class="bg-warning-subtle text-warning p-2 rounded-3 d-flex align-items-center justify-content-center"
                  style="width: 40px; height: 40px"
                >
                  <i class="bi bi-pencil-square fs-5"></i>
                </div>
                <h4 class="fw-bold text-dark m-0">Edit Tugas</h4>
              </div>

              <div class="mb-3">
                <label
                  for="title"
                  class="form-label text-secondary small fw-semibold"
                  >Judul Tugas</label
                >
                <input
                  type="text"
                  id="title"
                  class="form-control form-control-custom"
                  placeholder="Masukkan judul tugas"
                />
              </div>

              <div class="mb-3">
                <label
                  for="description"
                  class="form-label text-secondary small fw-semibold"
                  >Deskripsi</label
                >
                <textarea
                  id="description"
                  class="form-control form-control-custom"
                  rows="4"
                  placeholder="Tambahkan detail deskripsi tugas..."
                ></textarea>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-sm-6">
                  <label
                    for="status"
                    class="form-label text-secondary small fw-semibold"
                    >Status</label
                  >
                  <select id="status" class="form-select form-control-custom">
                    <option value="todo">Todo</option>
                    <option value="progress">Progress</option>
                    <option value="done">Done</option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label
                    for="due_date"
                    class="form-label text-secondary small fw-semibold"
                    >Batas Waktu</label
                  >
                  <input
                    type="date"
                    id="due_date"
                    class="form-control form-control-custom"
                  />
                </div>
              </div>

              <button
                onclick="updateTask()"
                class="btn btn-primary btn-custom btn-lg w-100 fw-bold shadow-sm py-2-5 fs-6"
              >
                <i class="bi bi-floppy me-1"></i> Simpan Perubahan
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API = "http://localhost:3000/api";
      const token = localStorage.getItem("token");
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!token || token === "undefined") {
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }

      async function getTask() {
        const response = await fetch(`${API}/tasks/${id}`, {
          headers: {
            authorization: token,
          },
        });
        const task = await response.json();

        document.getElementById("title").value = task.title || "";
        document.getElementById("description").value = task.description || "";
        document.getElementById("status").value = task.status || "todo";
        document.getElementById("due_date").value = task.due_date
          ? task.due_date.split("T")[0]
          : "";
      }

      async function updateTask() {
        const title = document.getElementById("title").value;
        const description = document.getElementById("description").value;
        const status = document.getElementById("status").value;
        const due_date = document.getElementById("due_date").value;

        if (!title) {
          alert("Judul tugas wajib diisi!");
          return;
        }

        await fetch(`${API}/tasks/${id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            authorization: token,
          },
          body: JSON.stringify({ title, description, status, due_date }),
        });

        alert("Task berhasil diupdate");
        window.location.href = "index.html";
      }

      getTask();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
