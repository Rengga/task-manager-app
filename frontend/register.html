<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - TaskFlow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
      }
      .card-custom {
        border: none;
        border-radius: 20px;
        background: #ffffff;
      }
      .btn-custom {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border: none;
        border-radius: 12px;
        transition: all 0.25s ease;
      }
      .btn-custom:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .form-control-custom {
        border-radius: 12px;
        padding: 12px 16px;
        border: 1px solid #e5e7eb;
        background-color: #f9fafb;
      }
      .form-control-custom:focus {
        background-color: #ffffff;
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
      }
      .icon-box {
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.1) 0%,
          rgba(5, 96, 105, 0.1) 100%
        );
        color: #10b981;
        width: 60px;
        height: 60px;
        border-radius: 16px;
      }
    </style>
  </head>
  <body class="d-flex align-items-center justify-content-center p-3">
    <div class="card card-custom shadow-lg p-4 w-100" style="max-width: 420px">
      <div class="card-body">
        <div class="text-center mb-4">
          <div
            class="icon-box d-flex align-items-center justify-content-center mx-auto mb-3"
          >
            <i class="bi bi-person-plus-fill fs-3"></i>
          </div>
          <h3 class="fw-bold text-dark m-0">Daftar Akun</h3>
          <p class="text-muted small mt-1">
            Buat akun baru untuk mulai mengatur tugas Anda
          </p>
        </div>

        <div class="mb-3">
          <label
            for="username"
            class="form-label text-secondary small fw-semibold"
            >Username</label
          >
          <div class="input-group">
            <span
              class="input-group-text bg-light border-end-0 rounded-start-3 text-muted"
            >
              <i class="bi bi-person"></i>
            </span>
            <input
              type="text"
              id="username"
              class="form-control form-control-custom border-start-0 rounded-end-3"
              placeholder="Buat username baru"
            />
          </div>
        </div>

        <div class="mb-4">
          <label
            for="password"
            class="form-label text-secondary small fw-semibold"
            >Password</label
          >
          <div class="input-group">
            <span
              class="input-group-text bg-light border-end-0 rounded-start-3 text-muted"
            >
              <i class="bi bi-lock"></i>
            </span>
            <input
              type="password"
              id="password"
              class="form-control form-control-custom border-start-0 rounded-end-3"
              placeholder="Buat password aman"
            />
          </div>
        </div>

        <button
          onclick="register()"
          class="btn btn-success btn-custom btn-lg w-100 fw-bold shadow-sm mb-4 py-2-5 fs-6"
        >
          Daftar Sekarang
        </button>

        <div class="text-center">
          <span class="text-muted small">Sudah punya akun?</span>
          <a
            href="login.html"
            class="text-success small fw-bold text-decoration-none ms-1"
            >Masuk di sini</a
          >
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
