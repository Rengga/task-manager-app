<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detail Tugas - TaskFlow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background-color: #f3f4f6;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .navbar-custom {
        background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      }
      .card-custom {
        border: none;
        border-radius: 16px;
        background: #ffffff;
      }
      .badge-custom {
        padding: 6px 12px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.85rem;
      }
      .detail-label {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .description-box {
        background-color: #f9fafb;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-5"
    >
      <div class="container py-1">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="index.html"
        >
          <i class="bi bi-grid-1x2-fill fs-4"></i>
          <span>TaskFlow</span>
        </a>
        <a
          href="index.html"
          class="btn btn-light btn-sm fw-bold px-3 py-2 rounded-3 text-primary shadow-sm d-flex align-items-center gap-2"
        >
          <i class="bi bi-arrow-left"></i> Kembali
        </a>
      </div>
    </nav>

    <div class="container mb-5">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7">
          <div class="card card-custom shadow-sm p-4">
            <div class="card-body" id="detail">
              <!-- Loading State Placeholder -->
              <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Memuat...</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API = "http://localhost:3000/api";
      const token = localStorage.getItem("token");
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!token || token === "undefined") {
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }

      async function getDetail() {
        const response = await fetch(`${API}/tasks/${id}`, {
          headers: {
            authorization: token,
          },
        });
        const task = await response.json();

        // Default styling jika status adalah Todo
        let badgeClass = "bg-info-subtle text-info-emphasis";
        let iconStatus = "bi-list-task";
        let displayStatus = "Todo";

        // Menentukan warna badge dan ikon secara dinamis sesuai halaman utama
        if (task.status === "done" || task.status === "Selesai") {
          badgeClass = "bg-success-subtle text-success";
          iconStatus = "bi-check-circle-fill";
          displayStatus = "Done";
        } else if (
          task.status === "progress" ||
          task.status === "Proses" ||
          task.status === "In Progress"
        ) {
          badgeClass = "bg-warning-subtle text-warning-emphasis";
          iconStatus = "bi-play-circle-fill";
          displayStatus = "In Progress";
        } else if (task.status === "todo" || task.status === "Todo") {
          badgeClass = "bg-info-subtle text-info-emphasis";
          iconStatus = "bi-list-task";
          displayStatus = "Todo";
        }

        const formattedDate = task.due_date
          ? new Date(task.due_date).toLocaleDateString("id-ID", {
              day: "numeric",
              month: "long",
              year: "numeric",
            })
          : "-";

        document.getElementById("detail").innerHTML = `
          <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4 pb-3 border-bottom">
            <div>
              <span class="detail-label text-muted d-block mb-1">Judul Tugas</span>
              <h3 class="fw-bold text-dark m-0">${task.title || "Tanpa Judul"}</h3>
            </div>
            <span class="badge badge-custom ${badgeClass} d-flex align-items-center gap-1 mt-1">
              <i class="bi ${iconStatus}"></i> ${displayStatus}
            </span>
          </div>

          <div class="mb-4">
            <span class="detail-label text-muted d-block mb-2">Deskripsi Tugas</span>
            <div class="description-box p-3 text-secondary">
              ${task.description || '<i class="text-muted small">Tidak ada deskripsi untuk tugas ini.</i>'}
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-sm-6">
              <div class="p-3 bg-light rounded-3 d-flex align-items-center gap-3">
                <div class="bg-primary-subtle text-primary rounded-2 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                  <i class="bi bi-calendar3 fs-5"></i>
                </div>
                <div>
                  <span class="detail-label text-muted d-block" style="font-size: 0.7rem;">Batas Waktu</span>
                  <span class="fw-semibold text-dark small">${formattedDate}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2 justify-content-end border-top pt-3 mt-4">
            <a href="edit-task.html?id=${task.id}" class="btn btn-warning fw-bold px-4 rounded-3 text-white d-flex align-items-center gap-2 shadow-sm">
              <i class="bi bi-pencil-square"></i> Edit Tugas
            </a>
          </div>
        `;
      }

      getDetail();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
